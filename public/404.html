<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAUST Career Bridge | Redirecting...</title>
    <base href="/" />
    <script>
      // Single Page Application redirect for static hosts (GitHub Pages, Firebase Hosting, Cloud Storage, S3)
      // Stores the requested sub-route and redirects to the index.html SPA entry point
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        try {
          sessionStorage.setItem('spa_redirect', window.location.href);
        } catch (e) {}

        // Fallback with query parameter in case sessionStorage is blocked or cleared
        var redirectUrl = '/?p=' + encodeURIComponent(path + search) + (hash ? '&h=' + encodeURIComponent(hash) : '');
        window.location.replace(redirectUrl);
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #F5F7FA; color: #0F2A4A;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="font-weight: 700; margin-bottom: 8px;">BAUST Career Bridge</h2>
      <p style="color: #64748B; font-size: 14px;">Loading page, please wait...</p>
    </div>
  </body>
</html>
